paths:
  raw_data_path: "data/external/aws_cpu_utilization.csv"
  processed_dir: "data/processed"

data_split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  sequence_length: 12
  target_column: "value"

model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2

training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 15