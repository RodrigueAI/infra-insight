[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-insight"
version = "0.1.0"
description = "A deep learning pipeline using PyTorch to forecast system infrastructure metrics."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rodrigue Lawson" }
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchmetrics>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
# Modernes Linting-Tool, das Flake8, isort und Black-Checks kombiniert
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"] # Error, Pyflakes, Warnings, Isort
ignore = []

[tool.ruff.per-file-ignores]
"notebooks/*" = ["E402", "F401"] # Ignoriere Pfad-Imports und ungenutzte Imports in Notebooks