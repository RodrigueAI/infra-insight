name: Code Quality & Linting (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    # 1. Repository-Code in die Pipeline-VM auschecken
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Python 3.10 exakt wie lokal aufsetzen
    - name: Set up Python 3.10
      uses: actions/uses/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # Beschleunigt zukünftige Pipeline-Runs

    # 3. Nur die schlanken Code-Qualitäts-Tools installieren (kein schweres PyTorch nötig für Linting!)
    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install black ruff

    # 4. Prüfen, ob der Code exakt nach Black-Standard formatiert ist
    - name: Check Code Formatting (Black)
      run: black --check src/

    # 5. Statische Code-Analyse und Import-Sortierung via Ruff prüfen
    - name: Run Linter (Ruff)
      run: ruff check src/
